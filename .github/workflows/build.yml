name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apk update && apk add make build-base || true

      - name: Compile SPRX
        run: |
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # استعراض الملفات للتأكد من المجلد
          echo "Current directory contents:"
          ls -la
          
          # البحث والدخول المباشر إلى أول مجلد يحتوي على Makefile
          for dir in ./*/; do
            if [ -f "${dir}Makefile" ] || [ -f "${dir}makefile" ]; then
              cd "$dir"
              break
            fi
          done
          
          make clean || true
          make

      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            **/*.sprx
