name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apk update && apk add make cmake build-base gcc g++ || true

      - name: Compile SPRX via CMake
        run: |
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # الانتقال إلى موقع مجلد المشروع الحقيقي داخل .github/workflows/ps44
          cd .github/workflows/ps44
          
          # إنشاء مجلد البناء وتجميع المشروع عبر CMake
          mkdir -p build && cd build
          cmake ..
          make

      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            .github/workflows/ps44/**/*.sprx
            **/*.sprx
