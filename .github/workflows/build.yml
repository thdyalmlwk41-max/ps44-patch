name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. حل مشكلة الأدوات وتعدد التوزيعات (Alpine/Debian)
      - name: Install All Required Build Tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk update && apk add make cmake build-base gcc g++ clang llvm ninja sed || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y make cmake build-essential clang llvm ninja-build sed || true
          fi

      # 2. البناء التراكمي: معالجة مسارات العمل، المترجم المكسور، وإصلاح SOURCES لـ CMake
      - name: Compile SPRX (Auto-Detect Build System & Path)
        run: |
          # إعداد متغيرات البيئة الرسمية لـ OpenOrbis
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export ORBISDEV=/opt/orbisdev
          export PATH=$OO_PS4_TOOLCHAIN/bin:$ORBISDEV/bin:$PATH
          
          # الدخول التلقائي لمجلد المشروع المكتشف
          if [ -d ".github/workflows/ps44" ]; then
            cd .github/workflows/ps44
          elif [ -d "ps44" ]; then
            cd ps44
          else
            TARGET_DIR=$(dirname $(find . -maxdepth 3 -iname "CMakeLists.txt" -o -iname "Makefile" | head -n 1) 2>/dev/null || echo ".")
            if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
              cd "$TARGET_DIR"
            fi
          fi
          
          echo "Working in directory: $(pwd)"
          ls -la

          # البناء عبر CMake
          if [ -f "CMakeLists.txt" ]; then
            echo "Building with CMake..."
            
            # حظر وتجنب خطأ تفريغ المصادر بضمان تسجيل ملفات src
            SRC_LIST=$(find src -type f \( -name "*.c" -o -name "*.cpp" \) 2>/dev/null | tr '\n' ' ')
            if [ -n "$SRC_LIST" ]; then
              echo "Found source files: $SRC_LIST"
              # إضافة تعيين صريح لـ SOURCES في حال عدم التعرف عليها داخل CMakeLists.txt
              sed -i '/add_library/i file(GLOB_RECURSE SRC_FILES "src/*.c" "src/*.cpp")' CMakeLists.txt || true
              sed -i 's/add_library(days_gone_900p SHARED/add_library(days_gone_900p SHARED ${SRC_FILES}/g' CMakeLists.txt || true
            fi
            
            # البحث عن ملف Toolchain الخاص بـ OpenOrbis
            TC_FILE=$(find /opt/orbisdev /usr/local/orbisdev -iname "*toolchain*.cmake" 2>/dev/null | head -n 1)
            
            # خيارات التجاوز والتوافق لعدم توقف المترجم Cross-Compiler
            CROSS_OPTS="-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_C_COMPILER_WORKS=TRUE -DCMAKE_CXX_COMPILER_WORKS=TRUE"

            # إنشاء مجلد البناء والبدء
            mkdir -p build && cd build

            if [ -n "$TC_FILE" ]; then
              cmake -DCMAKE_TOOLCHAIN_FILE="$TC_FILE" $CROSS_OPTS -DCMAKE_MAKE_PROGRAM=make .. || \
              cmake $CROSS_OPTS -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ ..
            else
              cmake $CROSS_OPTS -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ ..
            fi
            
            make clean || true
            make

          # البناء الاحتياطي عبر Make التلقائي
          elif [ -f "Makefile" ] || [ -f "makefile" ]; then
            echo "Building with Make..."
            make clean || true
            make
          else
            echo "No CMakeLists.txt or Makefile found!"
            exit 1
          fi

      # 3. رفع ملف الـ SPRX الناتج من أي مجلد
      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            **/*.sprx
            *.sprx
