name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apk update && apk add make build-base || true

      - name: Compile SPRX
        run: |
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # البحث عن المجلد الذي يحتوي على Makefile والدخول إليه
          TARGET_DIR=$(dirname $(find . -type f \( -iname "Makefile" -o -iname "makefile" \) | head -n 1))
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Entering directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          
          make clean || true
          make

      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            **/*.sprx
