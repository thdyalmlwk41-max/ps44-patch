name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          apk update && apk add make cmake build-base gcc clang || true

      - name: Direct Build SPRX
        run: |
          # 1. إعداد بيئة OpenOrbis
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export ORBISDEV=/opt/orbisdev
          export PATH=$OO_PS4_TOOLCHAIN/bin:$ORBISDEV/bin:$PATH
          
          # 2. الانتقال إلى مجلد الكود
          cd .github/workflows/ps44
          
          echo "Compiling Days Gone 900p Patch directly..."
          
          # 3. التجميع المباشر عبر orbis-clang وتوليد الملف النهائي
          orbis-clang -shared -s \
            -Iinclude \
            -I$OO_PS4_TOOLCHAIN/include \
            src/main.c src/hook.c src/pattern.c src/ue4.c \
            -o days_gone_900p.sprx \
            -L$OO_PS4_TOOLCHAIN/lib || \
          clang -shared -fPIC \
            -Iinclude \
            src/*.c \
            -o days_gone_900p.sprx

          ls -la days_gone_900p.sprx

      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            .github/workflows/ps44/*.sprx
            **/*.sprx
