name: Build PS4 SPRX Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apk update && apk add make build-base || true

      - name: Compile SPRX
        run: |
          export OO_PS4_TOOLCHAIN=/opt/orbisdev/toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          
          # البحث عن أول ملف Makefile والدخول لمجلده مباشرة
          MAKE_FILE=$(find . -iname "Makefile" | head -n 1)
          if [ -n "$MAKE_FILE" ]; then
            cd "$(dirname "$MAKE_FILE")"
          fi
          
          make clean || true
          make

      - name: Upload .sprx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaysGone-900p-Patch
          path: |
            **/*.sprx
