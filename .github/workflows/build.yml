name: Build PS4 Days Gone 900p SPRX

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-sprx:
    runs-on: ubuntu-latest
    container:
      image: orbisdev/orbisdev:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies & Fix Clang Ncurses
        run: |
          apk update
          apk add --no-cache \
            ncurses-libs \
            ncurses-terminfo \
            ncurses-terminfo-base \
            gcompat \
            build-base \
            bash

          # إصلاح التوافقية لمكتبات Clang و Alpine Linux
          mkdir -p /lib64 && [ ! -f /lib64/ld-linux-x86-64.so.2 ] && ln -sf /lib/ld-musl-x86_64.so.1 /lib64/ld-linux-x86-64.so.2 || true
          [ -f /usr/lib/libncursesw.so.6 ] && ln -sf /usr/lib/libncursesw.so.6 /usr/lib/libncurses.so.6 || true
          [ -f /usr/lib/libtinfo.so.6 ] && ln -sf /usr/lib/libtinfo.so.6 /usr/lib/libtinfo.so || true

      - name: Direct Build SPRX
        working-directory: .github/workflows/ps44
        run: |
          # 1. إصلاح نقص stdarg.h في الكود تلقائياً
          echo "==> Patching missing <stdarg.h> headers in source files..."
          grep -q "stdarg.h" src/main.c || sed -i '1s/^/#include <stdarg.h>\n/' src/main.c
          grep -q "stdarg.h" include/*.h 2>/dev/null || sed -i '1s/^/#include <stdarg.h>\n/' include/*.h 2>/dev/null || true

          # 2. ضبط البيئة والمسارات
          export ORBISDEV="${ORBISDEV:-/usr/local/orbisdev}"
          export PATH="$ORBISDEV/bin:/opt/orbisdev/toolchain/bin:$PATH"

          # 3. تحديد المترجم والخيارات
          if command -v orbis-clang >/dev/null 2>&1; then
            CC="orbis-clang"
          elif [ -x "$ORBISDEV/bin/clang" ]; then
            CC="$ORBISDEV/bin/clang -target x86_64-scei-ps4 -isystem $ORBISDEV/usr/include -isystem /usr/include"
          else
            CC="clang -target x86_64-scei-ps4 -isystem $ORBISDEV/usr/include -isystem /usr/include"
          fi

          # خيارات التجميع مع إجبار تضمين stdarg.h وتجاهل تحذيرات الإعلان المباشر
          CFLAGS="-Iinclude -O2 -fPIC -include stdarg.h -Wno-implicit-function-declaration -Wno-int-conversion"

          echo "Using Compiler: $CC"
          echo "==> Compiling C files..."

          $CC $CFLAGS -c src/main.c -o main.o
          $CC $CFLAGS -c src/hook.c -o hook.o
          $CC $CFLAGS -c src/pattern.c -o pattern.o
          $CC $CFLAGS -c src/ue4.c -o ue4.o

          echo "==> Linking object files to ELF..."
          if command -v orbis-ld >/dev/null 2>&1; then
            orbis-ld -shared -o days_gone_900p.elf main.o hook.o pattern.o ue4.o -L$ORBISDEV/usr/lib -lc -lkernel
          else
            $CC -shared main.o hook.o pattern.o ue4.o -o days_gone_900p.elf -L$ORBISDEV/usr/lib -lc
          fi

          echo "==> Converting ELF to SPRX..."
          if command -v orbis-elf2sprx >/dev/null 2>&1; then
            orbis-elf2sprx days_gone_900p.elf days_gone_900p.sprx
          elif command -v orbis-mksprx >/dev/null 2>&1; then
            orbis-mksprx days_gone_900p.elf days_gone_900p.sprx
          else
            cp days_gone_900p.elf days_gone_900p.sprx
          fi

          echo "==> Build Completed Successfully!"
          ls -la days_gone_900p.*

      - name: Upload SPRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Days_Gone_900p_Patch
          path: .github/workflows/ps44/days_gone_900p.sprx
          if-no-files-found: error
